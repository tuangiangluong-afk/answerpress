<svg width="480" height="400" viewBox="0 0 480 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="400" rx="16" fill="#0E1118" stroke="rgba(255,255,255,0.08)"/>
  <text x="24" y="36" fill="#F8FAFC" font-family="sans-serif" font-size="16" font-weight="700">Radar de Considération LLM</text>
  <text x="24" y="56" fill="#94A3B8" font-family="sans-serif" font-size="12">Scoring 12 critères vs Concurrents (Cas Réel Tefal / Philips)</text>
  
  <g transform="translate(240, 230)">
    <!-- Concentric radar circles -->
    <circle r="120" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    <circle r="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle r="60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <circle r="30" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <!-- Axes -->
    <line x1="0" y1="-120" x2="0" y2="120" stroke="rgba(255,255,255,0.1)"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="rgba(255,255,255,0.1)"/>
    <line x1="-85" y1="-85" x2="85" y2="85" stroke="rgba(255,255,255,0.1)"/>
    <line x1="-85" y1="85" x2="85" y2="-85" stroke="rgba(255,255,255,0.1)"/>
    
    <!-- Competitor Shape (Grey/Red) -->
    <polygon points="0,-70 55,-40 70,25 35,65 -45,55 -65,-30" fill="rgba(239,68,68,0.12)" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- AnswerPress Optimized Brand Shape (Vivid Blue/Green) -->
    <polygon points="0,-110 95,-60 100,40 60,95 -75,80 -95,-45" fill="rgba(59,130,246,0.25)" stroke="#3B82F6" stroke-width="2.5"/>
    
    <!-- Labels -->
    <text x="0" y="-126" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Autorité / Crédibilité (88/100)</text>
    <text x="130" y="0" text-anchor="start" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Contenu Pré-achat</text>
    <text x="0" y="135" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Réassurance Prix / FAQ</text>
    <text x="-130" y="0" text-anchor="end" fill="#E2E8F0" font-family="sans-serif" font-size="10" font-weight="600">Notoriété Médias</text>
  </g>
  
  <!-- Legend -->
  <g transform="translate(24, 360)">
    <rect width="12" height="12" rx="3" fill="#3B82F6"/>
    <text x="20" y="10" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="600">Votre Marque (Avec Pack AnswerPress)</text>
    <rect x="260" width="12" height="12" rx="3" fill="#EF4444"/>
    <text x="280" y="10" fill="#94A3B8" font-family="sans-serif" font-size="11">Moyenne Concurrents (Hors Média)</text>
  </g>
</svg>